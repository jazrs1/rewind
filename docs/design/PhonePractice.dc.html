<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rewind practice question</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F5A40}a:hover{color:#16241C}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #CFDCC8; color: #16241C; font-family: 'Atkinson Hyperlegible', sans-serif; padding: 20px 44px 24px 20px; display: flex; flex-direction: column; gap: 14px; overflow: hidden">
  <div style="position: absolute; right: 12px; top: 24px; bottom: 24px; display: flex; flex-direction: column; justify-content: space-between" aria-hidden="true">
    <sc-for list="{{marks}}" as="m" hint-placeholder-count="22"><div style="width: 16px; height: 6px; background: #16241C"></div></sc-for>
  </div>

  <div style="display: flex; align-items: center; gap: 12px">
    <button aria-label="Back" style="width: 48px; height: 48px; flex: none; border-radius: 10px; border: 2px solid #24573F; background: transparent; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M16 10H4M9 5l-5 5 5 5" fill="none" stroke="#24573F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </button>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <div style="font-size: 15px; font-weight: 700">COP3530, Exam 2 practice</div>
      <div style="font-size: 13px; color: #24573F">Question 4 of 12</div>
    </div>
  </div>

  <div style="display: flex; gap: 5px; padding-bottom: 12px; border-bottom: 1.5px solid #24573F" aria-label="Progress: 3 of 12 answered">
    <sc-for list="{{dots}}" as="d" hint-placeholder-count="12">
      <div style="flex: 1; height: 12px; border-radius: 6px; box-sizing: border-box; border: 1.5px solid #24573F; background: {{d.fill}}"></div>
    </sc-for>
  </div>

  <div style="display: flex; gap: 10px; align-items: baseline">
    <span style="font-family: 'Source Serif 4', serif; font-weight: 600; font-size: 26px; color: #24573F">4.</span>
    <h1 style="margin: 0; font-family: 'Source Serif 4', serif; font-weight: 600; font-size: 25px; line-height: 1.25">Insert 20 into this AVL tree. Which rotation restores balance?</h1>
  </div>

  <svg width="170" height="92" viewBox="0 0 200 110" role="img" aria-label="AVL tree: 10 at the root, 30 as its right child, 20 inserted as 30's left child" style="margin-left: 34px">
    <line x1="50" y1="24" x2="110" y2="58" stroke="#16241C" stroke-width="2"></line>
    <line x1="110" y1="58" x2="70" y2="92" stroke="#16241C" stroke-width="2" stroke-dasharray="5 4"></line>
    <circle cx="50" cy="24" r="18" fill="#E3EBDF" stroke="#16241C" stroke-width="2"></circle><text x="50" y="29" text-anchor="middle" font-size="15" font-family="Source Serif 4" fill="#16241C">10</text>
    <circle cx="110" cy="58" r="18" fill="#E3EBDF" stroke="#16241C" stroke-width="2"></circle><text x="110" y="63" text-anchor="middle" font-size="15" font-family="Source Serif 4" fill="#16241C">30</text>
    <circle cx="70" cy="92" r="16" fill="#E3EBDF" stroke="#16241C" stroke-width="2" stroke-dasharray="5 4"></circle><text x="70" y="97" text-anchor="middle" font-size="15" font-family="Source Serif 4" fill="#16241C">20</text>
  </svg>

  <div style="display: flex; flex-direction: column">
    <button style="display: flex; align-items: center; gap: 14px; min-height: 58px; padding: 0 4px; border: none; border-bottom: 1px solid #9DB39F; background: transparent; color: #16241C; text-align: left">
      <svg width="40" height="22" viewBox="0 0 44 24" aria-hidden="true" style="flex: none; overflow: visible"><defs><clipPath id="pencil-p"><path d="M2.6 11.6C2.3 5.4 9.2 1.1 21.4 1.3C33.6 1 42 4.4 42.3 11.9C42.7 19.2 34.2 23 21.8 22.7C9.3 23.1 2.9 18.7 2.6 11.6Z"></path></clipPath></defs><rect x="0.75" y="0.75" width="42.5" height="22.5" rx="11.25" fill="none" stroke="#24573F" stroke-width="1.5"></rect><path d="M2.6 11.6C2.3 5.4 9.2 1.1 21.4 1.3C33.6 1 42 4.4 42.3 11.9C42.7 19.2 34.2 23 21.8 22.7C9.3 23.1 2.9 18.7 2.6 11.6Z" fill="#3B4043"></path><g clip-path="url(#pencil-p)" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5L39 4.8L4.5 9.6L40.5 8.4L4 13L41 12.2L4.5 16.6L40 15.6L6.5 20.2L37 19.4" stroke="#2A2E30" stroke-width="3" opacity="0.5"></path><path d="M7 8.2L36 7.1M6 14.8L38 14.1M9 18.4L34 17.8" stroke="#62686C" stroke-width="0.9" opacity="0.3"></path></g></svg>
      <span style="font: 400 19px 'Source Serif 4', serif">Left rotation at 10</span>
    </button>
    <button style="display: flex; align-items: center; gap: 14px; min-height: 58px; padding: 0 4px; border: none; border-bottom: 1px solid #9DB39F; background: transparent; color: #16241C; text-align: left">
      <span style="width: 40px; height: 22px; flex: none; border-radius: 11px; box-sizing: border-box; border: 1.5px solid #24573F; color: #24573F; display: flex; align-items: center; justify-content: center; font: 700 12px 'Atkinson Hyperlegible', sans-serif">B</span>
      <span style="font: 400 19px 'Source Serif 4', serif">Right-left rotation at 10</span>
    </button>
    <button style="display: flex; align-items: center; gap: 14px; min-height: 58px; padding: 0 4px; border: none; border-bottom: 1px solid #9DB39F; background: transparent; color: #16241C; text-align: left">
      <span style="width: 40px; height: 22px; flex: none; border-radius: 11px; box-sizing: border-box; border: 1.5px solid #24573F; color: #24573F; display: flex; align-items: center; justify-content: center; font: 700 12px 'Atkinson Hyperlegible', sans-serif">C</span>
      <span style="font: 400 19px 'Source Serif 4', serif">Right rotation at 30</span>
    </button>
    <button style="display: flex; align-items: center; gap: 14px; min-height: 58px; padding: 0 4px; border: none; border-bottom: 1px solid #9DB39F; background: transparent; color: #16241C; text-align: left">
      <span style="width: 40px; height: 22px; flex: none; border-radius: 11px; box-sizing: border-box; border: 1.5px solid #24573F; color: #24573F; display: flex; align-items: center; justify-content: center; font: 700 12px 'Atkinson Hyperlegible', sans-serif">D</span>
      <span style="font: 400 19px 'Source Serif 4', serif">No rotation needed</span>
    </button>
  </div>

  <div style="font-size: 13px; color: #24573F">Written in the style of <a href="#" style="color: #1F4D38; text-decoration-color: #6E8F78">Exam 2 Review A</a>, from slide [N] of <a href="#" style="color: #1F4D38; text-decoration-color: #6E8F78">4 - Balanced Trees</a></div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
    <button style="min-height: 56px; border-radius: 10px; border: none; background: #24573F; color: #E8F0E3; font: 700 18px 'Atkinson Hyperlegible', sans-serif">Check answer</button>
    <a href="#" style="align-self: center; font-size: 15px; color: #1F4D38; text-decoration-color: #6E8F78">Skip for now</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const marks = Array.from({ length: 22 }, (_, i) => ({ i }));
    const dots = Array.from({ length: 12 }, (_, i) => ({ fill: i < 3 ? '#3B4043' : 'transparent' }));
    return { marks, dots };
  }
}
</script>
</body>
</html>
